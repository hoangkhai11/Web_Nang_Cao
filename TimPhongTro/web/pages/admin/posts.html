<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duyệt tin - Quản trị TimPhongTro</title>
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div id="navbar"></div>

<div class="page">
  <div class="container">
    <h1>Duyệt tin đăng</h1>
    <p class="sub">Kiểm duyệt các tin đăng do người dùng gửi lên trước khi hiển thị công khai.</p>

    <nav class="admin-tabs">
      <a href="/pages/admin/dashboard.html">Tổng quan</a>
      <a href="/pages/admin/rooms.html">Quản lý phòng</a>
      <a href="/pages/admin/posts.html" class="active">Duyệt tin</a>
      <a href="/pages/admin/users.html">Người dùng</a>
      <a href="/pages/admin/requests.html">Yêu cầu liên hệ</a>
    </nav>

    <form id="form-filter" class="admin-filter-bar card">
      <div>
        <label for="f-trangthai">Trạng thái</label>
        <select id="f-trangthai">
          <option value="ChoDuyet">Chờ duyệt</option>
          <option value="DaDuyet">Đã duyệt</option>
          <option value="TuChoi">Từ chối</option>
          <option value="DaAn">Đã ẩn</option>
          <option value="">Tất cả</option>
        </select>
      </div>
      <button class="btn" type="submit">Lọc</button>
    </form>

    <div class="table-wrap">
      <table>
        <thead><tr><th>Tiêu đề</th><th>Địa chỉ</th><th>Người đăng</th><th>Ngày đăng</th><th>Trạng thái</th><th></th></tr></thead>
        <tbody id="posts-body"><tr><td colspan="6" class="empty">Đang tải...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/admin/posts.js"></script>
</body>
</html>
