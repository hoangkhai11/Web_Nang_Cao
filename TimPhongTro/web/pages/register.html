<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký - TimPhongTro</title>
<link rel="stylesheet" href="/css/common.css">
</head>
<body>
<div id="navbar"></div>

<div class="auth-wrap">
  <div class="auth-card" style="max-width:420px;">
    <h1>Tạo tài khoản mới</h1>
    <p class="sub">Đăng ký để đăng tin phòng trọ, lưu tin và gửi yêu cầu liên hệ.</p>
    <form id="register-form">
      <div id="form-error" class="form-error"></div>
      <label for="in-hoten">Họ tên</label>
      <input id="in-hoten" required>
      <label for="in-email">Email</label>
      <input id="in-email" type="email" required>
      <label for="in-sdt">Số điện thoại</label>
      <input id="in-sdt">
      <label for="in-pass">Mật khẩu (tối thiểu 6 ký tự)</label>
      <input id="in-pass" type="password" required>
      <label for="in-pass2">Nhập lại mật khẩu</label>
      <input id="in-pass2" type="password" required style="margin-bottom:16px;">
      <button class="btn-block btn btn-primary" type="submit">Đăng ký</button>
    </form>
    <div class="auth-foot">Đã có tài khoản? <a href="/pages/login.html">Đăng nhập</a></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    renderNavbar('');
    document.getElementById('register-form').addEventListener('submit', doRegisterForm);
  });
</script>
</body>
</html>
