<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hồ sơ của tôi - TimPhongTro</title>
<link rel="stylesheet" href="/css/common.css">
</head>
<body>
<div id="navbar"></div>

<div class="page">
  <div class="container">
    <h1>Hồ sơ của tôi</h1>
    <p class="sub">Cập nhật thông tin cá nhân và quản lý tin đăng phòng trọ của bạn.</p>

    <div class="section-head"><h2>Thông tin cá nhân</h2></div>
    <div class="card" style="margin-bottom:24px;">
      <form id="form-info">
        <div id="info-error" class="form-error"></div>
        <div class="form-grid">
          <div><label for="in-email">Email</label><input id="in-email" disabled></div>
          <div><label for="in-hoten">Họ tên</label><input id="in-hoten" required></div>
          <div><label for="in-sdt">Số điện thoại</label><input id="in-sdt"></div>
        </div>
        <button class="btn btn-primary" type="submit">Lưu thông tin</button>
      </form>
    </div>

    <div class="section-head"><h2>Đổi mật khẩu</h2></div>
    <div class="card" style="margin-bottom:24px;">
      <form id="form-pass">
        <div id="pass-error" class="form-error"></div>
        <div class="form-grid">
          <div><label for="in-passold">Mật khẩu cũ</label><input id="in-passold" type="password" required></div>
          <div><label for="in-passnew">Mật khẩu mới</label><input id="in-passnew" type="password" required></div>
        </div>
        <button class="btn" type="submit">Đổi mật khẩu</button>
      </form>
    </div>

    <div class="section-head">
      <h2>Tin đăng của tôi</h2>
      <button class="btn btn-primary" id="btn-new-room">+ Đăng tin mới</button>
    </div>
    <div id="room-form-box"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Tiêu đề</th><th>Địa chỉ</th><th>Giá</th><th>Trạng thái</th><th></th></tr></thead>
        <tbody id="my-rooms-body"><tr><td colspan="5" class="empty">Đang tải...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
