<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập - TimPhongTro</title>
<link rel="stylesheet" href="/css/common.css">
</head>
<body>
<div id="navbar"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Đăng nhập</h1>
    <p class="sub">Đăng nhập để lưu tin, gửi yêu cầu liên hệ và đăng phòng.</p>
    <form id="login-form">
      <div id="form-error" class="form-error"></div>
      <label for="in-email">Email</label>
      <input id="in-email" type="email" required>
      <label for="in-pass">Mật khẩu</label>
      <input id="in-pass" type="password" required style="margin-bottom:16px;">
      <button class="btn-block btn btn-primary" type="submit">Đăng nhập</button>
    </form>
    <div class="auth-foot">Chưa có tài khoản? <a href="/pages/register.html">Đăng ký ngay</a></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    renderNavbar('');
    document.getElementById('login-form').addEventListener('submit', doLoginForm);
  });
</script>
</body>
</html>
